<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Community Lab</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #20242b; background: #f3f5f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    main { width: min(48rem, 100%); height: min(48rem, 92vh); display: flex; flex-direction: column; background: #fff; border: 1px solid #d8dde5; border-radius: 1rem; box-shadow: 0 1rem 3rem #18202c16; overflow: hidden; }
    header { padding: 1.1rem 1.4rem; border-bottom: 1px solid #e3e7ed; }
    h1 { margin: 0; font-size: 1.2rem; }
    header p { margin: .2rem 0 0; color: #657080; font-size: .9rem; }
    #new-chat { margin-top: .65rem; padding: .35rem .7rem; color: #294fae; background: transparent; border: 1px solid #aab8d4; }
    #messages { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex; flex-direction: column; gap: .8rem; }
    .message { max-width: 85%; padding: .75rem 1rem; border-radius: 1rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; color: white; background: #365fc7; border-bottom-right-radius: .25rem; }
    .agent { align-self: flex-start; color: #20242b; background: #edf0f5; border-bottom-left-radius: .25rem; }
    .error { color: #8b1b25; background: #ffebed; }
    .system-note { align-self: center; color: #657080; font-size: .82rem; }
    form { display: flex; gap: .65rem; padding: 1rem; border-top: 1px solid #e3e7ed; }
    .composer { flex: 1; display: flex; flex-direction: column; gap: .35rem; }
    .debug-option { color: #657080; font-size: .82rem; }
    .thinking { max-width: 90%; padding: .65rem .85rem; border-left: 3px solid #c18b31; background: #fff8e8; color: #59451f; white-space: pre-wrap; overflow-wrap: anywhere; font: .85rem/1.45 ui-monospace, monospace; }
    textarea { min-height: 2.8rem; max-height: 8rem; flex: 1; resize: vertical; padding: .65rem .8rem; border: 1px solid #c7ced8; border-radius: .65rem; font: inherit; }
    button { padding: 0 1.15rem; color: white; background: #294fae; border: 0; border-radius: .65rem; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.3rem; padding: 0 1.25rem .45rem; color: #657080; font-size: .85rem; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e9edf4; background: #151922; }
      main { background: #202631; border-color: #394251; }
      header, form { border-color: #394251; }
      header p, #status { color: #abb5c5; }
      .agent { color: #e9edf4; background: #303a49; }
      .thinking { color: #f2d99e; background: #383124; }
      .error { color: #ffdadd; background: #572930; }
      .system-note { color: #abb5c5; }
      textarea { color: #f5f7fa; background: #171c24; border-color: #4b5668; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Community Lab</h1>
      <p>Each browser tab has its own conversation. New tabs start fresh; learned knowledge is shared.</p>
      <button id="new-chat" type="button">Start a new conversation</button>
    </header>
    <section id="messages" aria-live="polite" aria-label="Conversation"></section>
    <div id="status" role="status"></div>
    <form id="chat-form">
      <div class="composer">
        <textarea id="prompt" aria-label="Your message" placeholder="Write a message…" rows="1" required></textarea>
        <label class="debug-option"><input id="show-thinking" type="checkbox"> Show model thinking (debug)</label>
      </div>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const prompt = document.querySelector('#prompt');
    const messages = document.querySelector('#messages');
    const send = document.querySelector('#send');
    const newChat = document.querySelector('#new-chat');
    const status = document.querySelector('#status');
    const showThinking = document.querySelector('#show-thinking');
    const sessionKey = 'community-session-id';
    function newSessionId() {
      return crypto.randomUUID().replaceAll('-', '');
    }
    let sessionId = sessionStorage.getItem(sessionKey);
    if (!sessionId) {
      sessionId = newSessionId();
      sessionStorage.setItem(sessionKey, sessionId);
    }

    function addMessage(text, kind) {
      const item = document.createElement('div');
      item.className = `message ${kind}`;
      item.textContent = text;
      messages.append(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function addThinking(text) {
      if (!text) return;
      const detail = document.createElement('details');
      detail.className = 'thinking';
      const summary = document.createElement('summary');
      summary.textContent = 'Model thinking';
      const content = document.createElement('div');
      content.textContent = text;
      detail.append(summary, content);
      messages.append(detail);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const message = prompt.value.trim();
      if (!message || send.disabled) return;
      addMessage(message, 'user');
      prompt.value = '';
      send.disabled = true;
      newChat.disabled = true;
      status.textContent = 'Loading the local model…';
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, session_id: sessionId, show_thinking: showThinking.checked })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'The reply failed.');
        if (result.new_conversation) {
          messages.replaceChildren();
          addMessage('Started a fresh conversation because the topic changed.', 'system-note');
          addMessage(message, 'user');
          status.textContent = 'Started a fresh conversation after a topic change.';
        }
        addMessage(result.reply, 'agent');
        addThinking(result.thinking);
        if (result.research_queued) addMessage('Scholar is looking this up for a future reply.', 'system-note');
        status.textContent = 'Updating knowledge and checking the reply…';
        prompt.focus();
        const ready = await fetch(`/api/ready?session_id=${sessionId}`);
        if (!ready.ok) throw new Error('Could not check whether curation finished.');
        const audit = await ready.json();
        for (const challenge of audit.challenges || []) {
          addMessage(`Curmudgeon challenged “${challenge.subject} — ${challenge.relation} — ${challenge.object}”. ${challenge.reason} Compared with ${challenge.evidence_refs.join(', ')}.`, 'system-note');
        }
        status.textContent = 'Ready';
      } catch (error) {
        addMessage(error.message, 'error');
        status.textContent = 'Ready';
      } finally {
        send.disabled = false;
        newChat.disabled = false;
      }
    });

    newChat.addEventListener('click', () => {
      if (newChat.disabled) return;
      sessionId = newSessionId();
      sessionStorage.setItem(sessionKey, sessionId);
      messages.replaceChildren();
      status.textContent = 'Started a fresh conversation. Learned knowledge is still available.';
      prompt.focus();
    });

    prompt.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    status.textContent = 'Ready';
  </script>
</body>
</html>
