[package]
name = "community-lab"
version = "0.1.0"
edition = "2024"
description = "A local chatbot with persistent conversation, sourced learning, and a research worker"
license = "MIT"

[dependencies]
candle-core = { version = "0.11.0", features = ["metal"] }
candle-nn = { version = "0.11.0", features = ["metal"] }
candle-transformers = { version = "0.11.0", features = ["metal"] }
ctrlc = { version = "3.5", features = ["termination"] }
html2text = "0.17.1"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
safetensors = "0.8.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
dotenvy = "0.15.7"
url = "2.5.8"
scraper = "0.27"
